name: Build and Upload

on:
  workflow_call:
    inputs:
      isRelease:
        required: true
        type: boolean
      shouldUpload:
        required: true
        type: boolean

env:
  CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
  CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
  SIGNING_KEY: ${{ secrets.PGP_SECRET }}
  SIGNING_PASSWORD: ${{ secrets.PGP_PASSPHRASE }}

jobs:
  build_linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get version
        id: version
        shell: bash
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("gradle/libs.versions.toml", "rb"))["versions"]["gdxWebGPURelease"])')"
          if [[ -z "$version" ]]; then
            echo "::error::Missing versions.gdxWebGPURelease in gradle/libs.versions.toml"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: 25

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build

      - name: Prepare Release deploy files
        if: ${{ inputs.shouldUpload && inputs.isRelease }}
        run: ./gradlew prepareRelease

      - name: Upload Release deploy files artifact
        uses: actions/upload-artifact@v7
        if: ${{ inputs.shouldUpload && inputs.isRelease }}
        with:
          name: release-staging-deploy-${{ steps.version.outputs.value }}
          path: ./build/staging-deploy/
          if-no-files-found: error

      - name: Upload Release to repository
        uses: nick-fields/retry@v3
        if: ${{ inputs.shouldUpload && inputs.isRelease }}
        with:
          max_attempts: 6
          timeout_minutes: 10
          retry_on: error
          command: ./gradlew publishRelease

      - name: Prepare Snapshot deploy files
        if: ${{ inputs.shouldUpload && !inputs.isRelease }}
        run: ./gradlew prepareSnapshot

      - name: Upload Snapshot deploy files artifact
        uses: actions/upload-artifact@v7
        if: ${{ inputs.shouldUpload && !inputs.isRelease }}
        with:
          name: snapshot-deploy-${{ steps.version.outputs.value }}-${{ github.run_number }}
          path: ./build/snapshot-deploy/
          if-no-files-found: error

      - name: Upload Snapshot to repository
        uses: nick-fields/retry@v3
        if: ${{ inputs.shouldUpload && !inputs.isRelease }}
        with:
          max_attempts: 6
          timeout_minutes: 10
          retry_on: error
          command: ./gradlew publishSnapshot

      - name: Create Git tag
        uses: actions/github-script@v9
        if: ${{ inputs.shouldUpload && inputs.isRelease }}
        env:
          VERSION: ${{ steps.version.outputs.value }}
        with:
          script: |
            const ref = `refs/tags/${process.env.VERSION}`;
            console.log(`Creating tag ${ref} at ${context.sha}`);
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref,
              sha: context.sha
            });
